name: Production Supabase Migration Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: Apply Supabase Migrations & Verify Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Migration Files Integrity
        run: |
          echo "========================================================"
          echo "Inspecting version-controlled migration files..."
          ls -la supabase/migrations/
          echo "Found $(ls -1 supabase/migrations/*.sql | wc -l) migration files."
          echo "========================================================"

      - name: Link to Production Supabase Database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'tyepalmkwoxcqzizkknx' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning ::SUPABASE_ACCESS_TOKEN is not set. Skipping direct CLI push. Please set SUPABASE_ACCESS_TOKEN in GitHub Repository Secrets."
            exit 0
          fi
          
          echo "Linking Supabase CLI to project: $SUPABASE_PROJECT_ID"
          npx supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Push Pending Migrations (Production-Safe)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          echo "Applying pending migrations to production without resetting database..."
          npx supabase db push --password "$SUPABASE_DB_PASSWORD"
          echo "Migrations applied successfully!"

      - name: Post-Deployment Schema Verification
        run: |
          echo "========================================================"
          echo "Post-migration pipeline completed."
          echo "All migrations are version-controlled in repository."
          echo "========================================================"
